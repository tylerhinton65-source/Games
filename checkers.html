<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Checkers</title>
<style>
/* Checkers — Tyler's Games. Runs in a frame inside index.html (like farm.html). */
:root{--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:var(--font);background:#14251c;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% 40%,#2a4a37 0%,#1a3024 55%,#101d16 100%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.tb{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;min-width:44px}
.tb:active{background:rgba(255,255,255,.26)}
.hud{flex:1;text-align:center;font-weight:800;font-size:17px;line-height:1.15}
.hud small{display:block;font-size:11.5px;opacity:.75;font-weight:700}
/* score row */
.score{display:flex;gap:8px;padding:4px 12px 6px;justify-content:center}
.pl{flex:1;max-width:150px;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 8px;text-align:center;border:2px solid transparent;transition:border-color .25s,background .25s}
.pl.mid{flex:.7}
.pl small{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:800;opacity:.85;white-space:nowrap;overflow:hidden}
.pl b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.pl.turn{border-color:#ffd666;background:rgba(255,214,102,.14)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.dot.red{background:#d8402f}.dot.black{background:#2a2a2e;border:1px solid #777}
/* taken pieces trays */
.tray{height:20px;display:flex;align-items:center;justify-content:center;gap:3px;opacity:.95}
.tray i{width:14px;height:14px;border-radius:50%;display:block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.tray i.red{background:#d8402f}.tray i.black{background:#2a2a2e;border:1px solid #777}
.tray span{font-size:11px;font-weight:800;opacity:.7;margin-left:4px}
/* board */
#wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px}
#frame{padding:10px;border-radius:16px;background:linear-gradient(145deg,#a8703f,#6e4122 55%,#5a3319);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#board{position:relative;touch-action:none;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.sq{position:absolute;width:12.5%;height:12.5%}
.sq.l{background:#eedfbd}
.sq.d{background:#356848;background-image:linear-gradient(145deg,rgba(255,255,255,.05),rgba(0,0,0,.08))}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,214,102,.22)}
.sq.tgt::after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(255,236,150,.85);box-shadow:0 0 10px rgba(255,220,100,.8)}
.sq.tgt.cap::after{left:22%;top:22%;width:56%;height:56%;background:none;border:4px solid rgba(255,214,102,.95)}
.pc{position:absolute;width:12.5%;height:12.5%;left:0;top:0;pointer-events:none;transition:transform .2s ease-in-out,opacity .25s}
.pc.drag{transition:none;z-index:20}
.pc.mov{z-index:15}
.pc .disc{position:absolute;inset:9%;border-radius:50%;transition:transform .15s,box-shadow .15s}
.pc.red .disc{background:radial-gradient(circle at 40% 32%,#ff7a5e 0%,#d83a2b 45%,#9a1f17 100%);
  box-shadow:0 3px 0 #6a120c,0 5px 8px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.12)}
.pc.black .disc{background:radial-gradient(circle at 40% 32%,#6a6a72 0%,#2c2c31 50%,#121214 100%);
  box-shadow:0 3px 0 #000,0 5px 8px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.08)}
.pc .disc::before{content:"";position:absolute;inset:17%;border-radius:50%;border:2px solid rgba(0,0,0,.22);box-shadow:0 1px 0 rgba(255,255,255,.18)}
.pc.black .disc::before{border-color:rgba(255,255,255,.14);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.pc .crown{position:absolute;inset:24%;display:none}
.pc.king .crown{display:block}
.pc.king .disc{box-shadow:0 3px 0 rgba(0,0,0,.8),0 6px 0 rgba(0,0,0,.35),0 8px 10px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.12)}
.pc.sel .disc{transform:scale(1.1) translateY(-3px);box-shadow:0 0 0 3px #ffd666,0 8px 14px rgba(0,0,0,.55)}
.pc.must .disc{animation:must 1.1s ease-in-out infinite}
@keyframes must{0%,100%{outline:0 solid rgba(255,214,102,0)}50%{outline:3px solid rgba(255,214,102,.9);outline-offset:1px}}
.pc.gone{opacity:0;transform-origin:center}
.pc.pop .crown{animation:cpop .5s ease-out}
@keyframes cpop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stat{min-height:26px;margin:10px 0 4px;font-weight:900;font-size:17px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.stat small{display:block;font-size:12px;font-weight:700;opacity:.7}
.btns{display:flex;gap:8px;justify-content:center;padding:4px 10px 10px}
.btn{background:rgba(255,255,255,.14);border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px;min-width:92px}
.btn:active{background:rgba(255,255,255,.26)}
.btn:disabled{opacity:.38}
.btn.go{background:#ffd666;color:#3a2600}
/* sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,12,8,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:#1f3b2b;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:up .28s cubic-bezier(.2,.8,.3,1);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:2px 0 4px;font-size:20px;text-align:center}
.sheet p{margin:0 0 12px;text-align:center;opacity:.75;font-size:13.5px;font-weight:600}
.lab{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin:14px 2px 7px}
.colors{display:flex;gap:10px}
.cbtn{flex:1;background:rgba(255,255,255,.08);border:3px solid transparent;border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:16px}
.cbtn small{font-size:11.5px;opacity:.7;font-weight:700}
.cbtn.on{border-color:#ffd666;background:rgba(255,214,102,.12)}
.cbtn .big{width:46px;height:46px;border-radius:50%;position:relative}
.cbtn .big.red{background:radial-gradient(circle at 40% 32%,#ff7a5e,#d83a2b 45%,#9a1f17);box-shadow:0 3px 0 #6a120c}
.cbtn .big.black{background:radial-gradient(circle at 40% 32%,#6a6a72,#2c2c31 50%,#121214);box-shadow:0 3px 0 #000}
.lvls{display:flex;flex-direction:column;gap:7px}
.lv{display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.08);border:3px solid transparent;border-radius:16px;padding:10px 12px}
.lv.on{border-color:#ffd666;background:rgba(255,214,102,.12)}
.lv b{font-size:16px;min-width:70px}
.lv span{font-size:12.5px;opacity:.75;font-weight:600;line-height:1.3}
.lv i{font-style:normal;margin-left:auto;font-size:12px;font-weight:800;opacity:.7;white-space:nowrap}
.tog{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px 12px;width:100%;text-align:left}
.tog span{flex:1;font-size:12.5px;opacity:.8;font-weight:600;line-height:1.3}
.tog span b{display:block;font-size:15px;opacity:1}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.22);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:#5bbf6e}.tog.on .sw::after{left:23px}
.row2{display:flex;gap:8px;margin-top:16px}
.row2 .btn{flex:1;padding:14px}
.small{display:block;margin:12px auto 0;font-size:13px;font-weight:700;opacity:.6;text-decoration:underline}
/* end card */
.card{margin:auto;width:min(330px,88vw);background:#1f3b2b;border-radius:24px;padding:22px 18px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.overlay.mid{align-items:center}
.card .ico{width:84px;height:84px;margin:0 auto 6px;border-radius:20px;overflow:hidden}
.card h2{margin:4px 0 2px;font-size:25px}
.card p{margin:0 0 6px;opacity:.8;font-weight:600;font-size:14px}
.card .tally{font-weight:800;font-size:13px;opacity:.7;margin:6px 0 12px}
.card .btn{display:block;width:100%;margin-top:8px;padding:13px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%);background:rgba(0,0,0,.75);padding:9px 16px;border-radius:99px;font-weight:800;font-size:14px;z-index:60;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pc{transition:opacity .2s}.pc.must .disc{animation:none;outline:3px solid rgba(255,214,102,.9)}}
</style></head><body>
<div id="app">
  <div class="bar">
    <button class="tb" id="back" aria-label="Menu">‹ Menu</button>
    <div class="hud">Checkers<small id="sub">Medium</small></div>
    <button class="tb" id="gear" aria-label="New game and settings">⚙︎</button>
  </div>
  <div class="score">
    <div class="pl" id="plMe"><small><i class="dot" id="dMe"></i><span id="nMe">You</span></small><b id="sMe">0</b></div>
    <div class="pl mid"><small>Draws</small><b id="sDr">0</b></div>
    <div class="pl" id="plAi"><small><i class="dot" id="dAi"></i>Computer</small><b id="sAi">0</b></div>
  </div>
  <div id="wrap">
    <div class="tray" id="trayTop"></div>
    <div id="frame"><div id="board"></div></div>
    <div class="tray" id="trayBot"></div>
    <div class="stat" id="stat">&nbsp;</div>
  </div>
  <div class="btns">
    <button class="btn" id="undo">↶ Undo</button>
    <button class="btn" id="hint">💡 Hint</button>
    <button class="btn" id="newg">↻ New</button>
  </div>
</div>

<div class="overlay" id="setup" hidden><div class="sheet">
  <h3>New game of checkers</h3>
  <p>Pick your color and how tough the computer should be.</p>
  <div class="lab">Your color</div>
  <div class="colors">
    <button class="cbtn" data-color="black"><i class="big black"></i>Black<small>You move first</small></button>
    <button class="cbtn" data-color="red"><i class="big red"></i>Red<small>Computer moves first</small></button>
  </div>
  <div class="lab">Difficulty</div>
  <div class="lvls">
    <button class="lv" data-lv="easy"><b>Easy</b><span>Makes lots of mistakes. Great for learning.</span><i id="rEasy"></i></button>
    <button class="lv" data-lv="medium"><b>Medium</b><span>A fair fight — it slips up now and then.</span><i id="rMedium"></i></button>
    <button class="lv" data-lv="hard"><b>Hard</b><span>Thinks ahead. Only a few mistakes a game.</span><i id="rHard"></i></button>
  </div>
  <div class="row2"><button class="btn" id="cancel">Cancel</button><button class="btn go" id="start">Start game</button></div>
  <button class="small" id="resetSc">Reset scores</button>
</div></div>

<div class="overlay mid" id="end" hidden><div class="card">
  <div class="ico" id="endIco"></div>
  <h2 id="endH">You win!</h2>
  <p id="endP">Nicely played!</p>
  <div class="tally" id="endT"></div>
  <button class="btn go" id="again">Play again</button>
  <button class="btn" id="change">Change color or difficulty</button>
  <button class="btn" id="endMenu">Menu</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
/*ENGINE-START*/
// Checkers engine. Board = 64 squares (row*8+col), row 0 at the top.
// 1 black man, 2 black king (black starts at the bottom, moves up), -1 red man, -2 red king.
const CK=(()=>{
  const KD=[[-1,-1],[-1,1],[1,-1],[1,1]],BD=[[-1,-1],[-1,1]],RD=[[1,-1],[1,1]];
  const dirs=p=>p===2||p===-2?KD:p>0?BD:RD;
  function init(){const b=new Array(64).fill(0);for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)&1){if(r<3)b[r*8+c]=-1;else if(r>4)b[r*8+c]=1}return b}
  function jumps(b,from,p,path,caps,out){
    const r=from>>3,c=from&7;let found=false;
    for(const [dr,dc] of dirs(p)){
      const tr=r+2*dr,tc=c+2*dc;if(tr<0||tr>7||tc<0||tc>7)continue;
      const m=(r+dr)*8+c+dc,t=tr*8+tc,q=b[m];
      if(q&&(q>0)!==(p>0)&&!b[t]&&!caps.includes(m)){
        found=true;
        const promo=(p===1&&tr===0)||(p===-1&&tr===7);
        if(promo)out.push({path:[...path,t],caps:[...caps,m]}); // crowning ends the move
        else jumps(b,t,p,[...path,t],[...caps,m],out);
      }
    }
    if(!found&&caps.length)out.push({path,caps});
  }
  // all legal moves for side (+1 black / -1 red). must = captures are compulsory.
  function moves(b,side,must){
    const J=[],S=[];
    for(let i=0;i<64;i++){const p=b[i];if(!p||(p>0)!==(side>0))continue;
      b[i]=0;jumps(b,i,p,[i],[],J);b[i]=p;
      const r=i>>3,c=i&7;
      for(const [dr,dc] of dirs(p)){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;const t=rr*8+cc;if(!b[t])S.push({path:[i,t],caps:[]})}
    }
    J.sort((a,b)=>b.caps.length-a.caps.length);
    return must&&J.length?J:J.concat(S);
  }
  function apply(b,m){const n=b.slice(),f=m.path[0],t=m.path[m.path.length-1];let p=n[f];n[f]=0;for(const c of m.caps)n[c]=0;
    if(p===1&&t<8)p=2;else if(p===-1&&t>=56)p=-2;n[t]=p;return n}
  const CEN=new Array(64).fill(0);for(let r=2;r<6;r++)for(let c=2;c<6;c++)CEN[r*8+c]=4;
  // score from black's point of view
  function evalB(b){
    let s=0,mb=0,mr=0,kb=0,kr=0;const KB=[],KR=[],PB=[],PR=[];
    for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const r=i>>3;
      if(p===1){mb++;s+=100+(7-r)*4+(r===7?7:0)+CEN[i];PB.push(i)}
      else if(p===-1){mr++;s-=100+r*4+(r===0?7:0)+CEN[i];PR.push(i)}
      else if(p===2){kb++;s+=165+CEN[i];KB.push(i);PB.push(i)}
      else{kr++;s-=165+CEN[i];KR.push(i);PR.push(i)}}
    const B=mb*100+kb*165,R=mr*100+kr*165,n=mb+mr+kb+kr;
    s+=(B-R)*(24-n)/48; // when ahead, trading down is good
    const chase=(K,T)=>{let d=0;for(const k of K){let m=9;for(const t of T){const x=Math.max(Math.abs((k>>3)-(t>>3)),Math.abs((k&7)-(t&7)));if(x<m)m=x}d+=m}return d};
    if(B>R&&KB.length)s-=chase(KB,PR)*3;
    if(R>B&&KR.length)s+=chase(KR,PB)*3;
    return s;
  }
  const WIN=100000;
  function nega(b,side,d,a,beta,must,ply,stat){
    stat.n++;
    const ms=moves(b,side,must);
    if(!ms.length)return -WIN+ply;
    if(d<=0){
      const caps=ms[0].caps.length?ms.filter(m=>m.caps.length):[];
      if(!caps.length||d<-10)return side*evalB(b);
      let best=-Infinity;
      if(!must){best=side*evalB(b);if(best>=beta)return best;if(best>a)a=best}
      for(const m of caps){const v=-nega(apply(b,m),-side,d-1,-beta,-a,must,ply+1,stat);if(v>best)best=v;if(v>a)a=v;if(a>=beta)break}
      return best;
    }
    let best=-Infinity;
    for(const m of ms){const v=-nega(apply(b,m),-side,d-1,-beta,-a,must,ply+1,stat);if(v>best)best=v;if(v>a)a=v;if(a>=beta)break}
    return best;
  }
  // every root move with an exact score (full window), best first
  function score(b,side,d,must){
    const stat={n:0};const ms=moves(b,side,must);
    const out=ms.map(m=>({m,v:ms.length===1?0:-nega(apply(b,m),-side,d-1,-Infinity,Infinity,must,1,stat)}));
    out.sort((x,y)=>y.v-x.v);return out;
  }
  // how each level plays: d = look-ahead, rand = chance of a totally random move,
  // slip = chance of a weaker move (no worse than `margin` below the best), noise = wobble on scores
  const LV={
    easy:  {d:2,rand:.30,slip:.40,margin:260,noise:45},
    medium:{d:2,rand:.03,slip:.18,margin:200,noise:22},
    hard:  {d:4,rand:0,  slip:.22,margin:160,noise:16}
  };
  function pick(b,side,level,must,rnd=Math.random,st={}){
    const L=LV[level]||LV.medium;
    const sc=score(b,side,L.d,must);
    if(sc.length===1)return sc[0].m;
    if(rnd()<L.rand)return sc[Math.floor(rnd()*sc.length)].m;
    const best=sc[0].v;
    if(best<WIN/2&&(L.maxSlips==null||(st.slips|0)<L.maxSlips)&&rnd()<L.slip){
      const worse=sc.filter(x=>x.v<best-8&&x.v>=best-L.margin);
      if(worse.length){st.slips=(st.slips|0)+1;return worse[Math.floor(rnd()*worse.length)].m}
    }
    let top=sc[0],tv=-Infinity;
    for(const x of sc){const v=x.v+(rnd()*2-1)*L.noise;if(v>tv){tv=v;top=x}}
    return top.m;
  }
  function hint(b,side,must){return score(b,side,4,must)[0].m}
  return{init,moves,apply,evalB,score,pick,hint,LV};
})();
/*ENGINE-END*/
const $=s=>document.querySelector(s);
// Saves follow Tyler's Games players: player 0 uses plain keys, others get a "p<id>:" prefix (?p=<id>).
const PID=(()=>{try{return new URLSearchParams(location.search).get('p')}catch(e){return null}})();
const K=k=>PID&&PID!=='0'?'p'+PID+':'+k:k;
const ld=(k,d)=>{try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}};
const myName=(()=>{try{const o=JSON.parse(localStorage.getItem('tg_players'));const id=PID?+PID:(o&&o.cur)||0;const p=o&&o.list&&o.list.find(x=>x.id===id);return p&&p.name?String(p.name).slice(0,14):'You'}catch(e){return 'You'}})();
const LVN={easy:'Easy',medium:'Medium',hard:'Hard'};
const HARD_LIMIT=3; // undos and hints per game on Hard
const DRAW_PLIES=50; // 25 moves each with no capture and no man moved = draw

let D=ld('tg_checkers',null);
if(!D||!D.set)D={set:{color:'black',level:'medium',must:true},sc:{easy:[0,0,0],medium:[0,0,0],hard:[0,0,0]},g:null};
for(const k of ['easy','medium','hard'])if(!Array.isArray(D.sc[k]))D.sc[k]=[0,0,0];
const save=()=>sv('tg_checkers',D);

// game state (D.g): b board, turn (1 black / -1 red), me (my side), lv, must, quiet, last [from,to], undo [], undos, hints, st {slips}, over
let hintTo=-1,hintFrom=-1;
let G=D.g,ids=[],nextId=1,busy=false,sel=-1,partial=null,tb=null,legal=[],drag=null,aiT=0;
const brd=$('#board');

// ---------- board drawing ----------
const flip=()=>G&&G.me===-1; // red at the bottom → turn the board around
const vr=i=>flip()?7-(i>>3):i>>3, vc=i=>flip()?7-(i&7):i&7;
const SQ=[];
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const d=document.createElement('div');d.className='sq '+((r+c)&1?'d':'l');brd.appendChild(d);SQ.push(d)}
function placeSquares(){for(let i=0;i<64;i++){const s=SQ[i];s.style.left=vc(i)*12.5+'%';s.style.top=vr(i)*12.5+'%'}}
const CROWN='<svg class="crown" viewBox="0 0 40 40"><path d="M6 29 L4 12 L13 19 L20 7 L27 19 L36 12 L34 29 Z" fill="#ffd34d" stroke="#a87512" stroke-width="2" stroke-linejoin="round"/><rect x="6" y="29" width="28" height="5" rx="1.5" fill="#f2b92e" stroke="#a87512" stroke-width="2"/><circle cx="20" cy="22" r="2.4" fill="#e2483b"/></svg>';
const PCS={};
function pieceEl(id){let e=PCS[id];if(!e){e=document.createElement('div');e.className='pc';e.innerHTML='<div class="disc">'+CROWN+'</div>';brd.appendChild(e);PCS[id]=e}return e}
const pos=(e,i,dx=0,dy=0)=>{e.style.transform=`translate(calc(${vc(i)*100}% + ${dx}px),calc(${vr(i)*100}% + ${dy}px))`};
function render(b){
  b=b||tb||G.b;const seen={};
  for(let i=0;i<64;i++){const p=b[i];if(!p){continue}let id=ids[i];if(!id){id=ids[i]=nextId++}seen[id]=1;
    const e=pieceEl(id);e.classList.remove('gone');e.classList.toggle('red',p<0);e.classList.toggle('black',p>0);e.classList.toggle('king',Math.abs(p)===2);if(!e.classList.contains('drag'))pos(e,i)}
  for(const id in PCS)if(!seen[id]){PCS[id].remove();delete PCS[id]}
  marks();trays(b);
}
function marks(){
  const b=tb||G.b;
  for(let i=0;i<64;i++)SQ[i].classList.remove('last','tgt','cap');
  if(G.last&&!partial)for(const i of G.last)SQ[i].classList.add('last');
  const myTurn=!G.over&&G.turn===G.me&&!busy;
  const movers=new Set(myTurn?legal.map(m=>m.path[0]):[]);
  const anyCap=legal.length&&legal[0].caps.length;
  for(let i=0;i<64;i++){const id=ids[i];if(!id||!PCS[id])continue;const e=PCS[id];
    e.classList.toggle('sel',i===sel);
    e.classList.remove('must')}
  if(hintTo>=0&&myTurn&&sel===hintFrom)SQ[hintTo].classList.add('tgt');
}
function trays(b){
  // pieces each side has captured, shown on that player's side of the board
  let red=0,black=0;for(const p of b){if(p>0)black++;else if(p<0)red++}
  const lostMe=12-(G.me>0?black:red),lostAi=12-(G.me>0?red:black);
  const meCol=G.me>0?'black':'red',aiCol=G.me>0?'red':'black';
  const row=(n,col)=>n?Array.from({length:Math.min(n,12)},()=>`<i class="${col}"></i>`).join(''):'';
  $('#trayBot').innerHTML=row(lostAi,aiCol);  // what I've taken
  $('#trayTop').innerHTML=row(lostMe,meCol);  // what the computer has taken
}
function size(){const w=$('#wrap');const s=Math.max(160,Math.floor(Math.min(w.clientWidth-36,w.clientHeight-20-40-52)));brd.style.width=brd.style.height=s+'px'}
addEventListener('resize',()=>{size()});

// ---------- HUD ----------
function hud(){
  const sc=D.sc[G.lv];
  $('#sub').textContent=`${LVN[G.lv]} · you're ${G.me>0?'Black':'Red'}`;
  $('#nMe').textContent=myName;
  $('#dMe').className='dot '+(G.me>0?'black':'red');$('#dAi').className='dot '+(G.me>0?'red':'black');
  $('#sMe').textContent=sc[0];$('#sDr').textContent=sc[1];$('#sAi').textContent=sc[2];
  $('#plMe').classList.toggle('turn',!G.over&&G.turn===G.me);$('#plAi').classList.toggle('turn',!G.over&&G.turn!==G.me);
  const hard=G.lv==='hard';
  $('#undo').textContent=hard?`↶ Undo (${HARD_LIMIT-G.undos})`:'↶ Undo';
  $('#hint').textContent=hard?`💡 Hint (${HARD_LIMIT-G.hints})`:'💡 Hint';
  $('#undo').disabled=busy||G.over||!G.undo.length||(hard&&G.undos>=HARD_LIMIT);
  $('#hint').disabled=busy||G.over||G.turn!==G.me||(hard&&G.hints>=HARD_LIMIT);
}
function status(t,s){$('#stat').innerHTML=t+(s?`<small>${s}</small>`:'')}
function drawNote(){const left=Math.ceil((DRAW_PLIES-G.quiet)/2);return G.quiet>=DRAW_PLIES-16?`No captures lately — draw in ${left} move${left===1?'':'s'}`:''}
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1700)}

// ---------- game flow ----------
function newGame(){
  clearTimeout(aiT);busy=false;
  const s=D.set;
  G=D.g={b:CK.init(),turn:1,me:s.color==='red'?-1:1,lv:s.level,must:true,quiet:0,last:null,undo:[],undos:0,hints:0,st:{},over:null,counted:false};
  ids=[];for(const id in PCS){PCS[id].remove();delete PCS[id]}
  save();placeSquares();begin();
}
function begin(){
  sel=-1;partial=null;tb=null;
  render();hud();
  if(G.over){showEnd(false);return}
  turnStart();
}
function turnStart(){
  legal=CK.moves(G.b,G.turn,G.must);
  if(!legal.length){finish(G.turn===G.me?'ai':'me');return}
  if(G.quiet>=DRAW_PLIES){finish('draw');return}
  hud();
  if(G.turn===G.me){
    const cap=legal[0].caps.length;
    hintTo=hintFrom=-1;
    status('Your turn',drawNote()||(G.last?'':'Tap a piece, then where it should go.'));
    marks();
  }else{
    status('Computer is thinking…',drawNote());busy=true;marks();hud();
    aiT=setTimeout(aiMove,420+Math.random()*380);
  }
}
function aiMove(){
  const g=G,m=CK.pick(G.b,G.turn,G.lv,G.must,Math.random,G.st);
  animate(m,()=>{if(G!==g)return;busy=false;commit(m)});
}
// slide a piece along its path, removing captured pieces as it hops over them
function animate(m,done){
  busy=true;hud();
  const from=m.path[0],id=ids[from],e=PCS[id];
  if(!e){done();return}
  e.classList.add('mov');
  let k=1;
  const step=()=>{
    if(k>=m.path.length){e.classList.remove('mov');done();return}
    pos(e,m.path[k]);
    const c=m.caps[k-1];
    setTimeout(()=>{if(c!=null&&ids[c]&&PCS[ids[c]])PCS[ids[c]].classList.add('gone');k++;setTimeout(step,m.caps.length?70:0)},m.caps.length?190:200);
  };
  requestAnimationFrame(step);
}
function commit(m){
  const p=G.b[m.path[0]],to=m.path[m.path.length-1];
  const man=Math.abs(p)===1;
  const nb=CK.apply(G.b,m);
  // move the piece id along
  const id=ids[m.path[0]];ids[m.path[0]]=0;for(const c of m.caps)ids[c]=0;ids[to]=id;
  const crowned=man&&Math.abs(nb[to])===2;
  G.b=nb;G.last=[m.path[0],to];G.quiet=(m.caps.length||man)?0:G.quiet+1;G.turn=-G.turn;
  sel=-1;partial=null;tb=null;
  save();render();
  if(crowned&&PCS[id]){PCS[id].classList.add('pop');setTimeout(()=>PCS[id]&&PCS[id].classList.remove('pop'),600);
    if(G.turn!==G.me)toast('👑 Crowned! Kings move both ways.')}
  turnStart();
}
function finish(who){
  G.over=who;
  if(!G.counted){G.counted=true;const sc=D.sc[G.lv];if(who==='me')sc[0]++;else if(who==='draw')sc[1]++;else sc[2]++}
  busy=false;save();hud();marks();
  status(who==='me'?'You win! 🎉':who==='draw'?'It\'s a draw':'Computer wins','');
  setTimeout(()=>showEnd(true),700);
}
function showEnd(){
  const who=G.over,sc=D.sc[G.lv];
  $('#endIco').innerHTML=ICON;
  $('#endH').textContent=who==='me'?'You win!':who==='draw'?'It\'s a draw':'Computer wins';
  $('#endP').textContent=who==='me'?(G.lv==='hard'?'You beat Hard — nicely played!':'Nicely played!'):who==='draw'?'Nobody could break through.':'So close — give it another go!';
  $('#endT').textContent=`${LVN[G.lv]}: ${myName} ${sc[0]} · Draws ${sc[1]} · Computer ${sc[2]}`;
  $('#end').hidden=false;
}

// ---------- your moves ----------
// next squares the selected piece can step/jump to, given any hops already made this turn
function nextSteps(i){
  const pre=partial||[i],n=pre.length,out=[],seen={};
  for(const m of legal){if(m.path[0]!==pre[0]||m.path.length<=n)continue;let ok=true;for(let k=0;k<n;k++)if(m.path[k]!==pre[k]){ok=false;break}
    if(!ok)continue;const to=m.path[n];if(seen[to])continue;seen[to]=1;out.push({to,cap:m.caps.length?m.caps[n-1]:-1})}
  return out;
}
function canPick(i){return legal.some(m=>m.path[0]===i)}
// a move that isn't allowed: say why, without showing where to go
function nope(){toast(legal.length&&legal[0].caps.length?'You have to jump when you can!':'Can\'t move there')}
function tapSquare(i){
  if(busy||G.over||G.turn!==G.me)return;
  const cur=partial?partial[partial.length-1]:sel;
  if(cur>=0){const st=nextSteps(partial?partial[0]:sel).find(t=>t.to===i);if(st){hop(st);return}}
  if(partial){if(i!==partial[partial.length-1])toast('Keep jumping with the same piece!');return} // mid double jump
  const p=G.b[i];
  if(p&&(p>0)===(G.me>0)){
    if(canPick(i)){sel=(sel===i)?-1:i;marks()}
    else if(legal[0].caps.length){toast('You have to jump when you can!')}
    else toast('That piece is stuck right now');
    return;
  }
  if(sel>=0){if(((i>>3)+(i&7))&1&&!(tb||G.b)[i])nope();sel=-1;marks()}
}
function hop(st){
  hintTo=hintFrom=-1;
  if(!partial){partial=[sel];G.undo.push({b:G.b.slice(),ids:ids.slice(),last:G.last,quiet:G.quiet,turn:G.turn,st:{...G.st}});if(G.undo.length>60)G.undo.shift()}
  const from=partial[partial.length-1];partial.push(st.to);
  tb=tb||G.b.slice();
  const p=tb[from];tb[from]=0;tb[st.to]=p;if(st.cap>=0){tb[st.cap]=0}
  const id=ids[from];
  // move ids on the temp board too so render() keeps the same element
  ids[from]=0;ids[st.to]=id;const capId=st.cap>=0?ids[st.cap]:0;if(st.cap>=0)ids[st.cap]=0;
  sel=st.to;busy=true;
  const e=PCS[id];if(e){e.classList.remove('drag');e.classList.add('mov');pos(e,st.to)}
  setTimeout(()=>{
    if(capId&&PCS[capId])PCS[capId].classList.add('gone');
    setTimeout(()=>{
      if(capId&&PCS[capId]){PCS[capId].remove();delete PCS[capId]}
      if(e)e.classList.remove('mov');busy=false;
      const more=nextSteps(partial[0]);
      if(more.length){status('Keep jumping!');marks();hud();return}
      // move complete: rebuild the full move and commit it from the turn-start board
      const m=legal.find(x=>x.path.length===partial.length&&x.path.every((v,k)=>v===partial[k]));
      // restore ids to turn start, commit() moves them properly
      const u=G.undo[G.undo.length-1];ids=u.ids.slice();
      commit(m);
    },st.cap>=0?120:0);
  },st.cap>=0?190:200);
}

// tap + drag on the board
function sqAt(x,y){const r=brd.getBoundingClientRect();const c=Math.floor((x-r.left)/r.width*8),rw=Math.floor((y-r.top)/r.height*8);if(c<0||c>7||rw<0||rw>7)return -1;
  const R=flip()?7-rw:rw,C=flip()?7-c:c;return R*8+C}
brd.addEventListener('pointerdown',e=>{
  if(busy||!G||G.over||G.turn!==G.me)return;
  const i=sqAt(e.clientX,e.clientY);if(i<0)return;
  const mine=(tb||G.b)[i]&&((tb||G.b)[i]>0)===(G.me>0);
  if(mine&&(partial?i===partial[partial.length-1]:canPick(i))){
    if(!partial){sel=i;marks()}
    drag={i,x:e.clientX,y:e.clientY,moved:false,id:ids[i]};
    try{brd.setPointerCapture(e.pointerId)}catch(_){}
  }else{drag=null;tapSquare(i)}
});
brd.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<9)return;drag.moved=true;
  const el=PCS[drag.id];if(!el)return;el.classList.add('drag');pos(el,drag.i,dx,dy);
});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;const el=PCS[d.id];
  if(!d.moved){if(el)el.classList.remove('drag');marks();return}
  const i=cancel?-1:sqAt(e.clientX,e.clientY);
  const st=i>=0?nextSteps(partial?partial[0]:d.i).find(t=>t.to===i):null;
  if(st){hop(st);return}
  if(el){el.classList.remove('drag');pos(el,d.i)}if(i>=0&&i!==d.i)nope();marks();
}
brd.addEventListener('pointerup',e=>endDrag(e,false));
brd.addEventListener('pointercancel',e=>endDrag(e,true));

// ---------- buttons ----------
$('#undo').onclick=()=>{
  if(busy||G.over||!G.undo.length)return;if(G.lv==='hard'&&G.undos>=HARD_LIMIT)return;
  clearTimeout(aiT);
  const u=G.undo.pop();G.b=u.b;ids=u.ids;G.last=u.last;G.quiet=u.quiet;G.turn=u.turn;G.st=u.st||{};
  if(G.lv==='hard')G.undos++;
  for(const id in PCS){PCS[id].remove();delete PCS[id]}
  sel=-1;partial=null;tb=null;save();render();turnStart();
};
$('#hint').onclick=()=>{
  if(busy||G.over||G.turn!==G.me)return;if(G.lv==='hard'&&G.hints>=HARD_LIMIT)return;
  if(partial){const more=nextSteps(partial[0]);if(more.length){toast('Keep jumping with the lifted piece');return}}
  const m=CK.hint(G.b,G.turn,G.must);
  if(G.lv==='hard')G.hints++;
  sel=hintFrom=m.path[0];hintTo=m.path[1];marks();
  status('Try this move',m.caps.length?'It captures a piece!':'Move the lifted piece to the dot.');
  save();hud();
};
function openSetup(first){
  const s={...D.set};
  const paint=()=>{
    document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('on',b.dataset.color===s.color));
    document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',b.dataset.lv===s.level));
    for(const k of ['easy','medium','hard']){const c=D.sc[k];$('#r'+k[0].toUpperCase()+k.slice(1)).textContent=c[0]||c[2]||c[1]?`${c[0]}–${c[2]}`:''}
  };
  document.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{s.color=b.dataset.color;paint()});
  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{s.level=b.dataset.lv;paint()});
  $('#start').onclick=()=>{D.set=s;$('#setup').hidden=true;$('#end').hidden=true;newGame()};
  $('#cancel').hidden=!!first;
  $('#cancel').onclick=()=>{$('#setup').hidden=true};
  paint();$('#setup').hidden=false;
}
$('#resetSc').addEventListener('click',()=>{
  const b=$('#resetSc');
  if(b.dataset.arm){D.sc={easy:[0,0,0],medium:[0,0,0],hard:[0,0,0]};save();hud();b.textContent='Scores reset ✓';delete b.dataset.arm;
    document.querySelectorAll('.lv i').forEach(x=>x.textContent='');return}
  b.dataset.arm=1;b.textContent='Tap again to reset all checkers scores';
});
$('#gear').onclick=()=>{if(busy&&G.turn===G.me)return;$('#resetSc').textContent='Reset scores';delete $('#resetSc').dataset.arm;openSetup(false)};
$('#newg').onclick=()=>$('#gear').onclick();
$('#again').onclick=()=>{$('#end').hidden=true;newGame()};
$('#change').onclick=()=>{$('#end').hidden=true;openSetup(true)};
$('#endMenu').onclick=goHome;
$('#back').onclick=goHome;
function goHome(){save();try{if(window.parent!==window&&window.parent.tgGoHome){window.parent.tgGoHome();return}}catch(e){}history.back()}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});

const ICON='<svg viewBox="0 0 84 84" width="84" height="84"><rect width="84" height="84" fill="#356848"/><g fill="#eedfbd"><rect x="0" y="0" width="21" height="21"/><rect x="42" y="0" width="21" height="21"/><rect x="21" y="21" width="21" height="21"/><rect x="63" y="21" width="21" height="21"/><rect x="0" y="42" width="21" height="21"/><rect x="42" y="42" width="21" height="21"/><rect x="21" y="63" width="21" height="21"/><rect x="63" y="63" width="21" height="21"/></g><circle cx="31.5" cy="33" r="15" fill="#6a120c"/><circle cx="31.5" cy="30" r="15" fill="#d83a2b"/><circle cx="31.5" cy="30" r="9.5" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2"/><circle cx="52.5" cy="56" r="15" fill="#000"/><circle cx="52.5" cy="53" r="15" fill="#2c2c31"/><path d="M43 58 L42 46 L48 51 L52.5 43 L57 51 L63 46 L62 58 Z" fill="#ffd34d" stroke="#a87512" stroke-width="1.5" stroke-linejoin="round"/></svg>';

// ---------- start ----------
requestAnimationFrame(()=>{
  size();
  if(G&&G.b&&G.b.length===64){G.must=true;G.undo=G.undo||[];G.st=G.st||{};placeSquares();begin()}
  else{G={b:CK.init(),turn:1,me:D.set.color==='red'?-1:1,lv:D.set.level,must:true,quiet:0,last:null,undo:[],undos:0,hints:0,st:{},over:null};
    placeSquares();render();hud();status('Pick your color to start','');openSetup(true)}
});
// test hooks
window.__ck={best:()=>CK.hint(G.b,G.turn,G.must).path,get G(){return G},get busy(){return busy},tap:i=>tapSquare(i),get legal(){return legal},D:()=>D};
</script>
