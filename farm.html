<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ASMR Farmer</title>
<style>
/* ASMR Farmer — slow, satisfying wheat harvesting. Hold to drive, slide to steer, steering help keeps rows straight. */
:root{--font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2414;color:#fff;font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.tb{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;min-width:44px}
.tb:active{background:rgba(255,255,255,.26)}
.hud{flex:1;text-align:center;font-weight:800;font-size:16px;line-height:1.15}
.hud small{display:block;font-size:11px;opacity:.72;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;padding:4px 14px 8px}
.pbar{flex:1;height:10px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e9b949,#ffe28a);transition:width .25s}
#ptxt{font-weight:900;font-size:14px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;min-height:0;touch-action:none;margin:0 6px 6px;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.58);padding:10px 16px;border-radius:16px;
  font-weight:800;font-size:13px;pointer-events:none;transition:opacity .6s;text-align:center;line-height:1.35;white-space:nowrap}
#hint.off{opacity:0}
.turn{position:absolute;bottom:18px;height:58px;padding:0 20px;border-radius:999px;background:rgba(255,214,102,.95);color:#3a2600;font-weight:900;font-size:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);animation:tp 1.6s ease-in-out infinite}
.turn:active{transform:scale(.95)}
#tL{left:14px}#tR{right:14px}
@keyframes tp{50%{box-shadow:0 4px 14px rgba(0,0,0,.35),0 0 0 6px rgba(255,214,102,.25)}}
.ov{position:fixed;inset:0;z-index:10;background:rgba(14,10,4,.55);display:flex;align-items:flex-end;justify-content:center;animation:fi .25s}
.ov.mid{align-items:center}
@keyframes fi{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:#4a3a18;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3,.card h3{margin:0 0 4px;font-size:20px;font-weight:900}
.sheet p,.card p{margin:0 0 12px;opacity:.78;font-size:13px;font-weight:600}
.opt{display:block;width:100%;border-radius:16px;padding:14px;margin:8px 0;font-weight:800;font-size:16px;text-align:left;background:rgba(255,255,255,.1)}
.opt small{display:block;font-weight:600;opacity:.7;font-size:12px;margin-top:2px}
.opt.primary{background:#ffd166;color:#2a1a00;text-align:center}
.opt.ghost{background:transparent;text-align:center;opacity:.8}
.opt .tog{float:right;font-size:13px;background:rgba(255,255,255,.15);border-radius:999px;padding:3px 10px}
.opt .tog.on{background:#ffd166;color:#3a2600}
.card{width:min(340px,88vw);background:#4a3a18;border-radius:24px;padding:22px 20px 12px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.wico{width:76px;height:76px;margin:0 auto 8px;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wico svg{width:100%;height:100%;display:block}
.stats{display:flex;justify-content:center;gap:26px;margin:4px 0 8px;font-weight:900;font-size:18px}
.stats small{display:block;font-size:11px;opacity:.7;font-weight:700}
</style></head>
<body>
<div id="app">
  <div class="bar">
    <button class="tb" id="back" aria-label="Back to games">‹</button>
    <div class="hud"><span id="ttl">Field 1</span><small id="sub">Wheat · 7 rows</small></div>
    <button class="tb" id="setBtn" aria-label="Settings">⚙︎</button>
  </div>
  <div class="prog"><div class="pbar"><i id="pfill"></i></div><span id="ptxt">0%</span></div>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="hint">Hold anywhere to drive · slide left/right to steer<br>Center your finger and it straightens up on the row</div>
    <button class="turn" id="tL" hidden>↶ Turn</button><button class="turn" id="tR" hidden>Turn ↷</button>
  </div>
</div>

<div class="ov" id="sheet" hidden><div class="sheet">
  <h3>ASMR Farmer</h3><p>Hold to drive, slide to steer. Tap ↶ ↷ at the end of a row for a perfect turn.</p>
  <button class="opt" id="fastBtn">🚜 Speed <span class="tog" id="fastTog">Chill</span><small>Chill is slow and smooth · Quick gets fields done faster</small></button>
  <button class="opt" id="asBtn">🧭 Steering help <span class="tog" id="asTog">On</span><small>Eases you straight and onto the row when your finger is centered</small></button>
  <button class="opt" id="sndBtn">🔊 Sound <span class="tog" id="sndTog">On</span><small>Engine rumble and crunchy wheat</small></button>
  <button class="opt" id="restart">↻ Start this field over</button>
  <button class="opt ghost" id="sClose">Close</button>
</div></div>

<div class="ov mid" id="win" hidden><div class="card">
  <div class="wico" id="wIco"></div>
  <h3 id="wT">Field harvested!</h3><p id="wP">Golden.</p>
  <div class="stats"><div><small>Time</small><span id="wTime">0:00</span></div><div><small>Bushels</small><span id="wBu">0</span></div><div><small>Fields</small><span id="wN">1</span></div></div>
  <button class="opt primary" id="wNext">Next field ›</button>
  <button class="opt ghost" id="wMenu">‹ Games</button>
</div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
// Saves follow Tyler's Games players: player 0 uses plain keys, others get a "p<id>:" prefix (?p=<id>).
const PID=(()=>{try{return new URLSearchParams(location.search).get('p')}catch(e){return null}})();
const K=k=>PID&&PID!=='0'?'p'+PID+':'+k:k;
const ld=(k,d)=>{try{const v=localStorage.getItem(K(k));return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(K(k),JSON.stringify(v))}catch(e){}};
let P=ld('tg_farm',null);
if(!P||!P.lvl)P={lvl:1,snd:true,fast:false,assist:true,cur:null};
if(P.assist===undefined)P.assist=true;
const saveP=()=>sv('tg_farm',P);

/* ---------- helpers ---------- */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const h2=(i,j,s)=>{let h=(i*374761393+j*668265263+(s|0)*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const sst=t=>t*t*(3-2*t);
const vn=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),fx=sst(x-i),fy=sst(y-j),a=h2(i,j,s),b=h2(i+1,j,s),c=h2(i,j+1,s),d=h2(i+1,j+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrap=a=>{a=(a+Math.PI)%(Math.PI*2);if(a<0)a+=Math.PI*2;return a-Math.PI};
const fmt=s=>{s=Math.max(0,s|0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const TAU=Math.PI*2;
function circ(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=f;c.fill()}
function ell(c,x,y,rx,ry,f,rot){c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);c.fillStyle=f;c.fill()}
function rr(c,x,y,w,h,r,f){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);c.fillStyle=f;c.fill()}

/* ---------- world (cell units; 92 cells across the screen, the field scrolls) ---------- */
const GW=92,FX0=8,FX1=84,TOP=40,HL=26,BOT=28;
const HEAD_F=5.6,HEAD_D=1.9;   // header cutter bar: front edge distance ahead of center, cutting depth
let F=null; // current field

function makeField(lvl){
  const rows=[7,7,8,8,8,9,9,10][Math.min(lvl-1,7)];
  const CL=240+40*Math.min(lvl-1,8);
  const CY0=TOP+HL,CY1=CY0+CL,GH=CY1+HL+BOT;
  const RW=(FX1-FX0)/rows,HW=RW+.9;
  const N=GW*GH,T=new Uint8Array(N);   // 0 grass inside fence, 1 wheat, 2 outside the fence
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=j*GW+i;
    if(j<TOP||j>=CY1+HL||i<3||i>=GW-3)T[k]=2;
    else if(i>=FX0&&i<FX1&&j>=CY0&&j<CY1)T[k]=1;}
  const req=[];for(let k=0;k<N;k++)if(T[k]===1)req.push(k);
  const R=rng(lvl*7919+3);
  return{lvl,rows,CL,CY0,CY1,GH,RW,HW,N,T,req,reqTotal:req.length,barnLeft:R()<.5,seed:lvl*7919+3,
    bounds:{x0:3+4.2,x1:GW-3-4.2,y0:TOP+1+7,y1:CY1+HL-1-7}};
}
const rowX=r=>FX0+(r+.5)*F.RW;
const rowOf=x=>clamp(Math.round((x-FX0)/F.RW-.5),0,F.rows-1);

/* ---------- colors ---------- */
const wheatCol=(i,j)=>{const n=(vn(i/9,j/14,3)-.5)*22+(h2(i,j,4)-.5)*10,d=(i%3===0)?-9:0;return[208+n+d,164+n*.85+d,74+n*.4+d*.6]};
const grassCol=(i,j)=>{const n=(vn(i/6,j/6,5)-.5)*14+(h2(i,j,6)-.5)*8;return[100+n*.6,138+n,60+n*.4]};
function stubbleCol(i,j,v){
  const ang=((v&127)-1)/126*TAU-Math.PI,px=-Math.sin(ang),py=Math.cos(ang),win=v&128;
  const st=Math.sin((i*px+j*py)*(win?2.6:1.7)),n=(h2(i,j,7)-.5)*(win?10:5)+(vn(i/5,j/5,8)-.5)*6;
  if(win)return[222+st*12+n,190+st*11+n,118+st*8+n*.6];
  return[184+st*7+n,158+st*6+n,104+st*4+n*.5];
}

/* ---------- canvases ---------- */
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d');
const G=document.createElement('canvas'),gx=G.getContext('2d');
let cs=4,dpr=1,CP=4,VW=0,VH=0;
let C={x:0,y:0,a:-Math.PI/2,v:0,steer:0,ap:null,reel:0,tank:0};
let cut=null,done=0,time=0,won=false,finishQ=null,finishWait=0,dirty=false,lastSave=0,lastT=0,cutRate=0,parts=[],markers=[],tick=0,camY=0,turnSides=[false,false];
let hold=null;

function fillCell(i,j,c){
  gx.fillStyle=`rgb(${clamp(c[0],0,255)|0},${clamp(c[1],0,255)|0},${clamp(c[2],0,255)|0})`;
  const x0=Math.floor(i*CP),x1=Math.floor((i+1)*CP),y0=Math.floor(j*CP),y1=Math.floor((j+1)*CP);
  gx.fillRect(x0,y0,x1-x0,y1-y0);
}
function paintCut(k,v){const i=k%GW,j=(k-i)/GW;fillCell(i,j,stubbleCol(i,j,v));
  const ang=((v&127)-1)/126*TAU-Math.PI,dx=Math.cos(ang),dy=Math.sin(ang),win=v&128;
  for(let n=0;n<(win?3:2);n++){const hx=h2(i,j,30+n),hy=h2(i,j,40+n),x=(i+hx)*CP,y=(j+hy)*CP,l=(win?.9:.45)*CP;
    gx.strokeStyle=n===0?(win?'rgba(250,226,160,.9)':'rgba(140,112,64,.55)'):(win?'rgba(196,160,90,.8)':'rgba(222,196,140,.6)');
    gx.lineWidth=Math.max(1,.2*CP);gx.beginPath();gx.moveTo(x-dx*l/2,y-dy*l/2);gx.lineTo(x+dx*l/2,y+dy*l/2);gx.stroke()}}

function paintGround(){
  G.width=Math.floor(GW*CP);G.height=Math.floor(F.GH*CP);gx.setTransform(1,0,0,1,0,0);
  const{T,GH}=F,R=rng(F.seed);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=j*GW+i;fillCell(i,j,T[k]===1?wheatCol(i,j):grassCol(i,j))}
  // wheat heads: short leaning strokes in a few golds, batched
  const cols=['rgba(240,206,120,.85)','rgba(226,186,96,.85)','rgba(170,124,50,.7)','rgba(250,222,150,.7)','rgba(196,150,66,.8)'];
  const paths=cols.map(()=>new Path2D());
  const n=Math.floor(F.reqTotal*2.2);
  for(let a=0;a<n;a++){const k=F.req[Math.floor(R()*F.reqTotal)],i=k%GW,j=(k-i)/GW;
    const x=(i+R())*CP,y=(j+R())*CP,len=(.5+R()*.6)*CP,an=-Math.PI/2+.45+(R()-.5)*.5,p=paths[Math.floor(R()*cols.length)];
    p.moveTo(x,y);p.lineTo(x+Math.cos(an)*len,y+Math.sin(an)*len)}
  gx.lineCap='round';gx.lineWidth=Math.max(1,.34*CP);paths.forEach((p,a)=>{gx.strokeStyle=cols[a];gx.stroke(p)});
  // grass tufts in the headlands
  const tuft=new Path2D();for(let a=0;a<GW*GH*.05;a++){const i=Math.floor(R()*GW),j=Math.floor(R()*GH);if(T[j*GW+i]===1)continue;const x=(i+R())*CP,y=(j+R())*CP;tuft.moveTo(x,y);tuft.lineTo(x+(R()-.5)*CP*.5,y-CP*.7)}
  gx.strokeStyle='rgba(70,112,44,.6)';gx.lineWidth=Math.max(1,.22*CP);gx.stroke(tuft);
  gx.setTransform(CP,0,0,CP,0,0);drawScenery(gx);gx.setTransform(1,0,0,1,0,0);
}

/* ---------- scenery around the field (drawn once into the ground) ---------- */
function drawScenery(c){
  const R=rng(F.seed+11),GH=F.GH,fy0=TOP,fy1=F.CY1+HL;
  // farmyard
  c.fillStyle='#8fb35a';c.fillRect(0,0,GW,TOP);
  c.fillStyle='#b9a888';c.fillRect(0,TOP-16,GW,10);                            // gravel lane along the fence
  const gate=GW/2-6;c.fillRect(gate,TOP-8,12,10);
  const bl=F.barnLeft,bx=bl?6:GW-6-30;
  // barn (gable roof seen from above)
  c.fillStyle='rgba(0,0,0,.22)';c.fillRect(bx+1.2,7.2,30,20);
  rr(c,bx,6,30,20,.6,'#a3352b');c.fillStyle='#8a2a22';c.fillRect(bx,16,30,10);
  c.fillStyle='rgba(0,0,0,.12)';for(let x=bx+1.5;x<bx+30;x+=1.5)c.fillRect(x,6,.15,20);
  c.fillStyle='#efe6d6';c.fillRect(bx,15.7,30,.6);c.fillRect(bx,6,30,.5);c.fillRect(bx,25.5,30,.5);
  rr(c,bx+12,4.5,6,3,.4,'#9b9b96');                                            // cupola
  // silos
  const sx=bl?bx+38:bx-10;
  for(const[dx,r]of[[0,5.5],[bl?12:-12,4.6]]){circ(c,sx+dx+1,15+1.2,r,'rgba(0,0,0,.22)');circ(c,sx+dx,15,r,'#c9ccd0');circ(c,sx+dx,15,r*.72,'#b3b7bd');circ(c,sx+dx-r*.25,15-r*.25,r*.3,'#e4e6ea');circ(c,sx+dx,15,r*.12,'#8d9096')}
  // trees
  for(let a=0;a<7;a++){const x=bl?50+R()*38:4+R()*34,y=3+R()*18;if(Math.abs(x-sx)<9)continue;const r=3+R()*2.2;
    circ(c,x+.8,y+1,r,'rgba(0,0,0,.2)');circ(c,x,y,r,'#3d7f34');circ(c,x-r*.25,y-r*.3,r*.55,'#57a04a')}
  // fence: posts + wire, gap at the gate
  const post=(x,y)=>{rr(c,x-.5,y-.5,1,1,.2,'#6b4a2c')};
  c.strokeStyle='rgba(225,225,225,.55)';c.lineWidth=.16;
  c.beginPath();c.moveTo(2.5,fy0);c.lineTo(gate,fy0);c.moveTo(gate+12,fy0);c.lineTo(GW-2.5,fy0);
  c.moveTo(2.5,fy0);c.lineTo(2.5,fy1);c.moveTo(GW-2.5,fy0);c.lineTo(GW-2.5,fy1);c.moveTo(2.5,fy1);c.lineTo(GW-2.5,fy1);c.stroke();
  for(let x=2.5;x<=GW-2.5;x+=6){if(x<gate||x>gate+12)post(x,fy0);post(x,fy1)}
  for(let y=fy0;y<=fy1;y+=6){post(2.5,y);post(GW-2.5,y)}
  rr(c,gate-.6,fy0-.8,1.2,1.6,.3,'#5b3b20');rr(c,gate+11.4,fy0-.8,1.2,1.6,.3,'#5b3b20');
  // outside strips
  c.fillStyle='rgba(60,90,40,.25)';c.fillRect(0,fy0,2,fy1-fy0);c.fillRect(GW-2,fy0,2,fy1-fy0);
  // county road at the bottom
  const ry=fy1+8;c.fillStyle='#7fa356';c.fillRect(0,fy1+1,GW,7);
  c.fillStyle='#55585e';c.fillRect(0,ry,GW,12);c.fillStyle='#e3c34a';for(let x=2;x<GW;x+=9)c.fillRect(x,ry+5.8,4.5,.5);
  c.fillStyle='#d8d4cb';c.fillRect(0,ry,GW,.4);c.fillRect(0,ry+11.6,GW,.4);
  c.fillStyle='#7fa356';c.fillRect(0,ry+12,GW,GH-ry-12);
  rr(c,bl?GW-12:10,fy1+3,1.4,2.6,.5,'#3a3d44');c.fillStyle='#d63a35';c.fillRect(bl?GW-10.6:11.4,fy1+3.4,.5,.9);
}

/* ---------- combine (faces +x locally) ---------- */
function drawCombine(c){
  const HW=F.HW;
  c.save();c.translate(C.x,C.y);c.rotate(C.a);
  ell(c,-.6,1,8,Math.max(5.2,HW*.5),'rgba(40,25,0,.22)');
  for(const y of[-2.7,2.7])rr(c,-6,y-.7,2.4,1.4,.5,'#1d1d21');                     // rear wheels
  for(const y of[-3.6,3.6])rr(c,-.2,y-.9,3.4,1.8,.6,'#1d1d21');                    // big front wheels
  rr(c,-6.6,-2.9,9,5.8,1.3,'#c8322b');                                             // body
  rr(c,-5.2,-2.4,4.8,4.8,.8,'#9e271f');                                            // grain tank
  const t=clamp(C.tank,0,1);if(t>.03){rr(c,-4.9+4.2*(1-t)*.5,-2.1+4.2*(1-t)*.5,4.2*t,4.2*t,.6*t,'#e8bd56');circ(c,-2.8,0,.9*t,'#f6d98a')}
  c.strokeStyle='#6f7178';c.lineWidth=.6;c.lineCap='round';c.beginPath();c.moveTo(-5.4,-3.25);c.lineTo(1,-3.25);c.stroke(); // folded unloading auger
  circ(c,-1.1,2,.42,'#2a2a2e');                                                    // exhaust
  rr(c,2.2,-1.3,1.6,2.6,.3,'#9e271f');                                             // feeder house
  rr(c,-.2,-1.8,2.8,3.6,.6,'#26292e');rr(c,.05,-1.55,2.25,3.1,.45,'#eae6dc');      // cab + roof
  c.fillStyle='#6fb6d6';c.fillRect(2.05,-1.5,.35,3);                               // windshield edge
  // header
  rr(c,3.4,-HW/2,HEAD_F-3.4+.1,HW,.5,'#3c3e44');
  rr(c,3.65,-HW/2+.35,1.5,HW-.7,.6,'#f0c232');                                    // reel
  c.fillStyle='rgba(120,80,0,.55)';for(let b=0;b<3;b++){const x=3.7+(((C.reel+b/3)%1+1)%1)*1.4;c.fillRect(x,-HW/2+.4,.16,HW-.8)}
  c.fillStyle='#cfd3d8';c.fillRect(HEAD_F-.25,-HW/2,.25,HW);                       // cutter bar
  for(const s of[-1,1]){c.beginPath();c.moveTo(3.4,s*HW/2);c.lineTo(HEAD_F+.9,s*(HW/2-.3));c.lineTo(3.4,s*(HW/2-.9));c.closePath();c.fillStyle='#55585f';c.fill()} // crop dividers
  circ(c,-6.7,-.8,.45,'#3a3b40');circ(c,-6.7,.8,.45,'#3a3b40');                    // chaff spreaders
  c.restore();
}

/* ---------- layout & build ---------- */
function layout(){
  const r=stage.getBoundingClientRect();if(r.width<100||r.height<100)return false;
  cs=r.width/GW;dpr=Math.min(2,window.devicePixelRatio||1);CP=cs*dpr;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);VW=GW;VH=r.height/cs;
  return true;
}

/* ---------- driving ---------- */
const vmax=()=>P.fast?.36:.21;

}
function move(dist){

}
// autopilot U-turn: straight out of the crop, quarter turn, slide along the headland, quarter turn into the new row
function planTurn(side){
  const{c,d}=cardinal(C.a);if(Math.abs(Math.sin(c))<.5||Math.abs(d)>.3)return null;
  const fy=Math.sin(c),r0=rowOf(C.x);

  for(let k=1;k<F.rows;k++){const r=r0+side*k;if(r<0||r>=F.rows)break;if(rowLeft(r)>.02){tr=r;break}}
  if(tr<0){const r=r0+side;if(r<0||r>=F.rows)return null;tr=r}
  const tx=rowX(tr),dx=tx-C.x;if(Math.abs(dx)<1)return null;
  const edge=fy<0?F.CY0:F.CY1,ahead=(C.y-edge)*(fy<0?1:-1);

}
function rowLeft(r){let n=0,t=0;const x0=Math.floor(FX0+r*F.RW+1),x1=Math.floor(FX0+(r+1)*F.RW-1);
  for(let j=F.CY0;j<F.CY1;j+=4)for(let i=x0;i<=x1;i+=2){t++;if(!cut[j*GW+i])n++}return t?n/t:0}

function startTurn(side){

}
function updTurnButtons(){
  let show=[false,false];

    const{c,d}=cardinal(C.a);
    if(Math.abs(Math.sin(c))>.5&&Math.abs(d)<.3){

/* ---------- harvesting ---------- */
function harvest(){
  const HW=F.HW,fx=Math.cos(C.a),fy=Math.sin(C.a),rx=-fy,ry=fx;
  const ang=1+Math.round((wrap(C.a)+Math.PI)/TAU*126);
  const cxh=C.x+fx*(HEAD_F-HEAD_D/2),cyh=C.y+fy*(HEAD_F-HEAD_D/2),ext=HW/2+HEAD_D;
  const x0=Math.max(0,Math.floor(cxh-ext)),x1=Math.min(GW-1,Math.floor(cxh+ext)),y0=Math.max(0,Math.floor(cyh-ext)),y1=Math.min(F.GH-1,Math.floor(cyh+ext));
  let fresh=0;
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++){
    const k=j*GW+i;if(F.T[k]!==1||cut[k])continue;
    const dx=i+.5-C.x,dy=j+.5-C.y,w=dx*fx+dy*fy,u=dx*rx+dy*ry;
    if(w<HEAD_F-HEAD_D||w>HEAD_F+.2||Math.abs(u)>HW/2)continue;
    const v=ang|(Math.abs(u)<HW*.15?128:0);cut[k]=v;paintCut(k,v);done++;fresh++;
  }
  cutRate=cutRate*.9+fresh*.1;
  if(fresh){dirty=true;C.tank=Math.min(1,C.tank+fresh/2600);if(C.tank>=1)C.tank=0;
    if(Math.random()<.9)spawn(fresh);if(tick%3===0)hud();
    if(!won&&done/F.reqTotal>=.992)startFinish()}
}
function spawn(n){
  const fx=Math.cos(C.a),fy=Math.sin(C.a),rx=-fy,ry=fx,R=Math.random;
  for(let a=0;a<Math.min(3,1+n/14)&&parts.length<260;a++){
    const s=(R()-.5)*1.6,sp=.12+R()*.18;
    parts.push({k:0,x:C.x-fx*6.9+rx*s,y:C.y-fy*6.9+ry*s,vx:-fx*sp+rx*(R()-.5)*.35,vy:-fy*sp+ry*(R()-.5)*.35,life:26+R()*30,r:R()*TAU,vr:(R()-.5)*.4,c:Math.floor(R()*3)})}

}
const CHAFF=['#f2d283','#e2bb5e','#c99c46'];

}
function drawParts(c){

function updMarkers(){

function startFinish(){

function stepFinish(f){

function showWin(){
  const lines=['Golden.','The bin is full!','Straight as a fence line.','Smells like harvest.','That was nice.'];
  $('#wIco').innerHTML=ICON;$('#wT').textContent=`Field ${F.lvl} harvested!`;$('#wP').textContent=lines[F.lvl%lines.length];
  $('#wTime').textContent=fmt(time);$('#wBu').textContent=Math.round(F.reqTotal*.06).toLocaleString();$('#wN').textContent=F.lvl;

/* ---------- camera & drawing ---------- */
function camTarget(){const up=Math.sin(C.a)<0;return clamp(C.y-VH*(up?.64:.36),0,Math.max(0,F.GH-VH))}
function frame(t){
  requestAnimationFrame(frame);

  if(!F||!cv.width)return;
  tick++;
  if(!won)drive(f);else C.v=Math.max(0,C.v-.01*f);
  stepFinish(f);updParts(f);
  if(tick%20===0)updMarkers();if(tick%6===0)updTurnButtons();

  const oy=camY*CP;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  const sy=Math.max(0,Math.round(oy)),sh=Math.min(cv.height,G.height-sy);

  // steering help guide: faint line along the row you're settling onto
  if(P.assist&&hold&&C.steer===0&&!C.ap&&!won){const{c,d}=cardinal(C.a);if(Math.abs(Math.sin(c))>.5&&Math.abs(d)<.62&&C.y>F.CY0-10&&C.y<F.CY1+10){
    const tx=rowX(rowOf(C.x)),fy=Math.sin(c),y2=fy<0?F.CY0:F.CY1;ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=.35;ctx.setLineDash([1.6,1.6]);

}

/* ---------- sound (synthesized) ---------- */
let AC=null;const A={};
function audioUnlock(){
  if(!P.snd)return;
  if(!AC){
    try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const sr=AC.sampleRate,buf=AC.createBuffer(1,sr*2,sr),d=buf.getChannelData(0);let b0=0,b1=0,b2=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b0=.997*b0+w*.029;b1=.985*b1+w*.032;b2=.95*b2+w*.048;d[i]=(b0+b1+b2+w*.06)*.9}
    const noise=()=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*1.5);return s};
    A.master=AC.createGain();A.master.gain.value=.9;A.master.connect(AC.destination);
    A.eng=AC.createGain();A.eng.gain.value=0;
    const elp=AC.createBiquadFilter();elp.type='lowpass';elp.frequency.value=220;elp.connect(A.eng);A.eng.connect(A.master);
    A.o1=AC.createOscillator();A.o1.type='sawtooth';A.o1.frequency.value=44;A.o1.connect(elp);A.o1.start();
    A.o2=AC.createOscillator();A.o2.type='triangle';A.o2.frequency.value=88;const g2=AC.createGain();g2.gain.value=.5;A.o2.connect(g2);g2.connect(elp);A.o2.start();
    const nl=AC.createBiquadFilter();nl.type='lowpass';nl.frequency.value=300;noise().connect(nl);const g3=AC.createGain();g3.gain.value=1.2;nl.connect(g3);g3.connect(A.eng);
    // crunchy wheat with a gentle reel rhythm
    A.cr=AC.createGain();A.cr.gain.value=0;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=.9;noise().connect(bp);
    const am=AC.createGain();am.gain.value=.75;bp.connect(am);am.connect(A.cr);A.cr.connect(A.master);
    const lfo=AC.createOscillator();lfo.frequency.value=2.4;const lg=AC.createGain();lg.gain.value=.25;lfo.connect(lg);lg.connect(am.gain);lfo.start();
  }
  if(AC.state==='suspended')AC.resume();
}
function audioTick(){
  if(!AC)return;const now=AC.currentTime,live=P.snd&&!document.hidden&&$('#win').hidden;
  const mv=clamp(C.v/vmax(),0,1);
  A.eng.gain.setTargetAtTime(live?.035+.04*mv:0,now,.15);
  A.o1.frequency.setTargetAtTime(40+mv*10,now,.3);A.o2.frequency.setTargetAtTime(80+mv*20,now,.3);
  A.cr.gain.setTargetAtTime(live?Math.min(.13,cutRate*.006):0,now,.08);
}
function chime(){
  if(!AC||!P.snd)return;const now=AC.currentTime;
  [[523.25,0],[659.25,.12],[783.99,.24]].forEach(([fq,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=fq;
    g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(.12,now+t+.02);g.gain.exponentialRampToValueAtTime(.001,now+t+.9);o.connect(g);g.connect(A.master);o.start(now+t);o.stop(now+t+1)});
}

/* ---------- input ---------- */
stage.addEventListener('pointerdown',e=>{if(!F||won||e.target.closest('.turn'))return;audioUnlock();
  hold={id:e.pointerId,x0:e.clientX,x:e.clientX,y:e.clientY};try{stage.setPointerCapture(e.pointerId)}catch(_){}$('#hint').classList.add('off');e.preventDefault()});

  const off=hold.x-hold.x0;if(Math.abs(off)>78)hold.x0=hold.x-Math.sign(off)*78; // wheel never runs out of room

const up=e=>{if(hold&&e.pointerId===hold.id)hold=null};

$('#tL').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();startTurn(-1)});
$('#tR').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();startTurn(1)});
// keyboard for desktop: ↑/W drive, ←/→ steer, Q/E turn
const keys={};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='q')startTurn(-1);if(e.key==='e')startTurn(1);syncKeys()});
addEventListener('keyup',e=>{keys[e.key]=0;syncKeys()});

  if(go){audioUnlock();const r=stage.getBoundingClientRect();hold={id:'k',x0:r.left+r.width/2,x:r.left+r.width/2+st*50,y:r.top+r.height*.75};$('#hint').classList.add('off')}
  else if(hold&&hold.id==='k')hold=null}

/* ---------- buttons ---------- */
function goHome(){saveCur();try{if(window.parent!==window&&window.parent.tgGoHome){window.parent.tgGoHome();return}}catch(e){}history.back()}
$('#back').onclick=goHome;$('#wMenu').onclick=goHome;
